name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Java test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile
        run: |
          mkdir -p build/stub build/classes build/tests
          javac -encoding UTF-8 -d build/stub $(find stub -name '*.java')
          javac -encoding UTF-8 -cp build/stub -d build/classes $(find midlet/src -name '*.java')
          javac -encoding UTF-8 -cp "build/classes:build/stub" -d build/tests $(find test/shim test/src -name '*.java')

      - name: Run tests
        run: java -cp "build/classes:build/tests" com.chatterbox.test.TestMain

  gateway:
    name: Gateway sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python3 -m py_compile gateway/server.py
