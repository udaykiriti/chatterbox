# ProGuard configuration for Chatterbox MIDlet
# Referenced from build.xml as inline args, but kept here for reference

# Keep the MIDlet entry point
-keep class com.chatterbox.ui.ChatterboxMIDlet { *; }

# Keep all MIDlet implementations
-keep class * implements javax.microedition.midlet.MIDlet { *; }

# Keep test classes (not in final JAD but useful for desktop test runs)
-keep class com.chatterbox.test.** { *; }

# Keep JUnit shim
-keep class junit.framework.** { *; }

# Don't warn about MicroEdition APIs (we provide stubs)
-dontwarn javax.microedition.**

# Optimizations
-optimizationpasses 5
-allowaccessmodification
-repackageclasses ''
-overloadaggressively
-useuniqueclassmembernames
-flattenpackagehierarchy ''
-mergeinterfacesaggressively

# Keep line numbers for stack traces on device
-keepattributes SourceFile,LineNumberTable

# Preserve RMS record store names (they're strings in code)
-keepclassmembers class com.chatterbox.rms.* {
    static final java.lang.String *;
}